<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 480" width="100%" height="100%">
  <defs>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="activeNodeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0e7490"/>
      <stop offset="100%" stop-color="#155e75"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="480" rx="16" fill="#0b0f17" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Flow Boxes -->
  <!-- Box 1: Client / Agent -->
  <rect x="60" y="160" width="220" height="150" rx="12" fill="url(#nodeGrad)" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="170" y="200" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Autonomous AI Agent</text>
  <text x="170" y="225" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">(Client / Consumer)</text>
  <line x1="80" y1="245" x2="260" y2="245" stroke="#334155" stroke-width="1"/>
  <text x="170" y="265" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Initiates HTTP 402 Request</text>
  <text x="170" y="285" font-family="-apple-system, sans-serif" font-size="11" fill="#38bdf8" text-anchor="middle">Signs EIP-3009 Transfer</text>

  <!-- Arrow 1 -->
  <line x1="280" y1="235" x2="380" y2="235" stroke="#06b6d4" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="380,230 395,235 380,240" fill="#06b6d4"/>
  <text x="330" y="225" font-family="monospace" font-size="10" fill="#22d3ee" text-anchor="middle">HTTP 402 / Sig</text>

  <!-- Box 2: Kite Facilitator -->
  <rect x="395" y="140" width="220" height="190" rx="12" fill="url(#activeNodeGrad)" stroke="#22d3ee" stroke-width="2"/>
  <text x="505" y="180" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Kite Facilitator v2</text>
  <text x="505" y="205" font-family="monospace" font-size="12" fill="#a5f3fc" text-anchor="middle">(Settlement Relay)</text>
  <line x1="415" y1="225" x2="595" y2="225" stroke="#164e63" stroke-width="1"/>
  <text x="505" y="245" font-family="-apple-system, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">Validates Domain Separator</text>
  <text x="505" y="265" font-family="-apple-system, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">Broadcasts on Kite Testnet (2368)</text>
  <text x="505" y="285" font-family="-apple-system, sans-serif" font-size="11" fill="#e0f2fe" text-anchor="middle">Guarantees Zero-Deduction</text>

  <!-- Arrow 2 -->
  <line x1="615" y1="235" x2="710" y2="235" stroke="#34d399" stroke-width="2" stroke-dasharray="4"/>
  <polygon points="710,230 725,235 710,240" fill="#34d399"/>
  <text x="665" y="225" font-family="monospace" font-size="10" fill="#34d399" text-anchor="middle">Block Events</text>

  <!-- Box 3: Telemetry Indexer -->
  <rect x="725" y="160" width="220" height="150" rx="12" fill="url(#nodeGrad)" stroke="#10b981" stroke-width="1.5"/>
  <text x="835" y="200" font-family="-apple-system, sans-serif" font-size="16" font-weight="bold" fill="#ffffff" text-anchor="middle">Telemetry Indexer</text>
  <text x="835" y="225" font-family="monospace" font-size="12" fill="#94a3b8" text-anchor="middle">(untruebattl Module)</text>
  <line x1="745" y1="245" x2="925" y2="245" stroke="#334155" stroke-width="1"/>
  <text x="835" y="265" font-family="-apple-system, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Parses Nonces &amp; Hash</text>
  <text x="835" y="285" font-family="-apple-system, sans-serif" font-size="11" fill="#34d399" text-anchor="middle">Streams Aggregated Metrics</text>

  <!-- Title Bottom Legend -->
  <text x="500" y="420" font-family="-apple-system, sans-serif" font-size="13" font-weight="500" fill="#64748b" text-anchor="middle">Figure 1.0: End-to-End Cryptographic x402 Micropayment &amp; Telemetry Stream Pipeline on Kite Blockchain</text>
</svg>
